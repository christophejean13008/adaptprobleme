<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adaptproblème</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECF1;--ui:#FFFFFF;--paper:#FFFFFF;--ink:#000000;--muted:#55616C;--line:#C9D3DB;--hi:#F2B705;--hi-soft:#FFF3C4;
  --cu:#2F6FDE;--cd:#D7263D;--cc:#2A9D5C;--c0:#2F6FDE;--c1:#D7263D;--c2:#2A9D5C;--c3:#E9A800;--c4:#7B4FC9;--c5:#E76F1C;--c6:#1A9BA8;--c7:#8A5A2B;--c8:#C2185B;--c9:#5C6BC0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191D;--ui:#20262C;--paper:#262D34;--ink:#F3F5F7;--muted:#A5B0BA;--line:#3A444D;--hi-soft:#4A3E12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15191D;--ui:#20262C;--paper:#262D34;--ink:#F3F5F7;--muted:#A5B0BA;--line:#3A444D;--hi-soft:#4A3E12;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Andika,"Trebuchet MS",Verdana,sans-serif;font-size:18px;line-height:1.4}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--c0);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:22px;display:flex;align-items:center;gap:10px}
.brand svg{width:52px;height:30px}
.steps{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.steps button{border:2px solid var(--line);background:var(--ui);border-radius:999px;padding:4px 14px;font-size:16px}
.steps button[aria-current="step"]{border-color:var(--ink);font-weight:700}
.steps button:disabled{opacity:.45;cursor:default}
.btn{border:2px solid var(--line);background:var(--ui);border-radius:10px;padding:6px 12px;font-size:17px}
.btn.on{border-color:var(--ink);background:var(--hi-soft)}
.btn.primary{background:var(--c0);border-color:var(--c0);color:#fff;font-weight:700;padding:10px 20px}
.btn:disabled{opacity:.4;cursor:default}
main{flex:1;min-height:0;overflow:auto;padding:0 16px 16px}
.wrap{max-width:1300px;margin:0 auto}
h1{font-size:28px;margin:6px 0 4px;line-height:1.2}
h2{font-size:22px;margin:18px 0 4px}
.lead{color:var(--muted);margin:0 0 16px;max-width:62ch}
.speak{border:2px solid var(--line);background:var(--ui);border-radius:10px;padding:2px 10px;font-size:20px;line-height:1.3;flex:none}

/* Choix du schéma */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--ui);border:3px solid transparent;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card:has(.pick:hover){border-color:var(--line)}
.card.chosen{border-color:var(--ink)}
.pick{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.mini{width:100%;height:auto;display:block}
.pick strong{font-size:19px;line-height:1.25}
.card .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.card p{margin:0;color:var(--muted);font-size:15px}

/* SVG schéma */
.inkf{fill:var(--ink)}
.lns{stroke:var(--ink);stroke-width:16;fill:none;stroke-linecap:round}
.zs{fill:var(--paper);stroke:var(--ink);stroke-width:18}
.qt{fill:var(--ink);font-family:"Arial Black",Arial,sans-serif;font-weight:900}
.qt.inv{fill:var(--paper)}

/* Écran objets */
.two{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:24px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.recap{background:var(--ui);border-radius:14px;padding:14px;position:sticky;top:0}
.recap strong{display:block;font-size:19px;margin-top:8px}
.recap p{margin:4px 0 0;color:var(--muted);font-size:15px}
textarea{width:100%;min-height:80px;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--ui);resize:vertical;font-size:18px}
label.lab{font-weight:700;display:block;margin-bottom:6px}
.noun{background:var(--ui);border-radius:14px;padding:12px;margin-bottom:12px;border-left:8px solid var(--c)}
.nr{display:flex;gap:8px;align-items:center}
.nr input{flex:1;min-width:0;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:20px;background:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:3px solid var(--line);background:var(--paper);border-radius:12px;min-width:52px;height:52px;font-size:30px;display:grid;place-items:center;padding:0 8px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",Andika,sans-serif}
.chip.txt{font-size:16px;font-family:inherit}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.more{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:2px dashed var(--line)}
.more .chip{min-width:44px;height:44px;font-size:24px;border-width:2px}
.msg{color:var(--c1);font-weight:700;min-height:1.4em}

/* Espace de travail */
.ws{display:flex;flex-direction:column;height:100%;gap:8px}
.wsbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wtitle{font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--ui);border-radius:12px;padding:3px;border:2px solid var(--line);margin-left:auto}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;font-weight:700;font-size:17px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.enonce{background:var(--ui);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:flex-start;font-size:19px}
.enonce div{flex:1;white-space:pre-wrap}
.stagewrap{flex:1;min-height:240px;display:flex;align-items:center;justify-content:center;position:relative}
.stage{position:relative;width:600px;height:372px;--u:6px;user-select:none;-webkit-user-select:none;flex:none}
.stage>svg{position:absolute;left:0;top:0;width:100%;height:100%}
.zone{position:absolute;background:var(--paper);border:calc(var(--u)*1.2) solid var(--ink);border-radius:calc(var(--u)*1.6);touch-action:none;cursor:copy;transition:box-shadow .15s}
.zone.circle{border-radius:50%}
.zone.arrow{background:transparent;border:0;border-radius:0}
.zone.over{box-shadow:0 0 0 calc(var(--u)*1) var(--hi)}
.zone.arrow.over{box-shadow:none;outline:calc(var(--u)*1) solid var(--hi)}
.qm{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font:900 var(--qs)/1 "Arial Black",Arial,sans-serif;color:var(--line);pointer-events:none}
.zone.arrow .qm{color:var(--paper);opacity:.5}
.items{position:absolute;top:calc(var(--u)*.9);right:calc(var(--u)*.9);bottom:calc(var(--u)*.9);left:calc(var(--u)*.9);display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:center;gap:calc(var(--s,40px)*.1);overflow:hidden}
.items.cmpz{justify-content:flex-start;align-content:flex-start}
.zone.circle .items{top:15%;right:15%;bottom:15%;left:15%}
.it{width:var(--s,40px);height:var(--s,40px);display:grid;place-items:center;line-height:1;touch-action:none;cursor:grab;flex:none}
.it.emo{font-size:calc(var(--s,40px)*.84);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.it.word{width:auto;padding:0 .4em;font-size:calc(var(--s,40px)*.42);border:max(2px,calc(var(--s,40px)*.06)) solid var(--c);border-radius:.5em;background:var(--paper);color:var(--ink);font-weight:700;white-space:nowrap}
.it.cube{--c:var(--cu);background:var(--c);border-radius:calc(var(--s,40px)*.14);box-shadow:inset calc(var(--s,40px)*-.1) calc(var(--s,40px)*-.1) 0 rgba(0,0,0,.25),inset calc(var(--s,40px)*.07) calc(var(--s,40px)*.07) 0 rgba(255,255,255,.35)}
.bar{display:flex;flex-direction:column-reverse;gap:1px;padding:1px;background:var(--ink);border-radius:3px}
.zone.arrow .bar{background:var(--paper)}
.bar .cube{border-radius:1px;--c:var(--cd)}
.bar.hund .cube{--c:var(--cc)}
.loose{display:grid;grid-template-columns:repeat(3,var(--s,40px));gap:calc(var(--s,40px)*.15);align-self:center}
.it.lifted{opacity:.25}
.zone.arrow .it.emo{background:var(--paper);border-radius:50%;font-size:calc(var(--s,40px)*.7)}
.bignum{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font-weight:700;font-size:var(--ns);pointer-events:none}
.zone.arrow .bignum{color:var(--paper)}
.bignum.q{font-family:"Arial Black",Arial,sans-serif}
.badge{position:absolute;top:calc(var(--u)*-2);right:calc(var(--u)*-2);min-width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);border-radius:99px;background:var(--hi);color:#000;font-weight:700;display:grid;place-items:center;font-size:calc(var(--u)*2.7);padding:0 calc(var(--u)*1);border:calc(var(--u)*.4) solid var(--ink);pointer-events:none}
.sign{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--u)*2.3);border:calc(var(--u)*.4) solid var(--ink);background:var(--paper);border-radius:99px;padding:calc(var(--u)*.3) calc(var(--u)*1.8);font-weight:700;white-space:nowrap}
.branchq{position:absolute;transform:translate(-50%,-50%);font:900 calc(var(--u)*8)/1 "Arial Black",Arial,sans-serif;pointer-events:none}
.branchq.n{font-family:Andika,sans-serif;font-weight:700;font-size:calc(var(--u)*6)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .grow{flex:1}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--ui);border:2px solid var(--line);border-radius:10px;padding:2px 6px}
.stepper button{border:0;background:var(--bg);border-radius:8px;width:34px;height:32px;font-size:20px;font-weight:700}
.palette{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ui);border-radius:14px;padding:8px 12px}
.palette .hint{color:var(--muted);font-size:15px;flex:1;min-width:200px}
.tok{display:flex;align-items:center;gap:8px;border:3px solid var(--line);border-radius:12px;background:var(--paper);padding:4px 14px 4px 6px;touch-action:none;font-size:18px;font-weight:700;--s:42px}
.tok[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tok .it{cursor:grab}
.padd{display:flex;gap:6px;align-items:center}
.padd input{width:170px;border:2px solid var(--line);border-radius:10px;padding:7px 10px;font-size:17px;background:var(--paper)}
.zone.qedit{outline:calc(var(--u)*.5) dashed var(--c1);outline-offset:calc(var(--u)*.6)}
.it.pic img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}
.zone.arrow .it.pic{background:#fff;border-radius:18%;padding:6%}
.btn.big{font-size:20px;padding:12px 18px;border-color:var(--ink);font-weight:700;margin:4px 0 8px}
.nico{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:4px;--s:46px;flex:none}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--ui);border-radius:18px;width:min(1100px,100%);max-height:100%;min-height:min(560px,100%);overflow:auto;padding:16px 18px}
.mhead{display:flex;align-items:center;gap:12px;justify-content:space-between;position:sticky;top:-16px;background:var(--ui);padding:6px 0;z-index:1}
.mhead h2{margin:0}
#psearch{width:100%;font-size:24px;border:3px solid var(--ink);border-radius:12px;padding:10px 14px;margin:8px 0;background:var(--paper)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cats .chip{height:44px;font-size:17px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-bottom:10px}
.tile{border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;--s:64px;font-size:16px;line-height:1.2;position:relative;cursor:pointer}
.tile .it{cursor:pointer}
.tile.has{border-color:var(--c2);background:var(--hi-soft)}
.tile.has::after{content:"✓";position:absolute;top:4px;right:6px;background:var(--c2);color:#fff;border-radius:99px;width:26px;height:26px;display:grid;place-items:center;font-weight:700}
.prop{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--hi-soft);border-radius:14px;padding:10px;margin:0 0 10px}
.prop .tile{width:112px}
.tile.off{opacity:.4}
.ptip{color:var(--muted);font-size:15px;flex:1;min-width:200px}
.webbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.empty{color:var(--muted);margin:6px 0;grid-column:1/-1}
.credit{color:var(--muted);font-size:13px;margin:10px 0 0}
.teach{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--ui);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 16px}
.tprev{display:grid;grid-template-columns:repeat(2,64px);gap:4px;flex:none}
.tprev svg{width:64px;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:4px}
.ttxt{flex:1;min-width:240px;display:flex;flex-direction:column;gap:4px}
.ttxt span{color:var(--muted);font-size:15px}
.tbtn{display:flex;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none;display:inline-block}
.lvlsec{margin-top:22px;padding-top:14px;border-top:2px dashed var(--line)}
.lvls{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:8px}
.lgroup{background:var(--ui);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lgroup h3{margin:0 6px 0 0;font-size:16px;color:var(--muted);width:100%}
.lbtn{font-size:26px;font-weight:700;min-width:86px;height:62px;border:3px solid var(--line);border-radius:14px;background:var(--paper)}
.lbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.prog{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.prog li{background:var(--ui);border-radius:14px;padding:12px 12px 12px 54px;display:flex;flex-direction:column;gap:10px;position:relative;justify-content:space-between}
.pnum{position:absolute;top:12px;left:12px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:700}
.ph{display:flex;gap:10px;align-items:flex-start}.ph svg{width:96px;flex:none;height:auto}.ph strong{display:block;font-size:18px;line-height:1.25}
.pic{font-size:40px;line-height:1;flex:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pex{color:var(--muted);font-style:italic;font-size:15px;margin-top:4px}.pex .speak{font-size:15px;padding:0 6px;font-style:normal}
.prog li>.btn{align-self:flex-start}
.mat .mbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.mat .mbar h1{flex:1;margin:0;font-size:26px}
.mtell{display:flex;gap:10px;align-items:flex-start;background:var(--ui);border-radius:12px;padding:8px 12px;margin:8px 0}
#mtxt{flex:1}#mtxt p{margin:2px 0;font-size:18px;color:var(--muted)}#mtxt p.now{font-size:24px;font-weight:700;color:var(--ink)}
.mstagewrap{display:flex;justify-content:center}
.mstage{position:relative;background:#FFFDF7;border:3px solid var(--line);border-radius:18px;width:640px;height:360px;--u:6.4px;overflow:hidden;color:#000}
.mc{position:absolute;display:flex;flex-direction:column;cursor:default}
.mlab{text-align:center;font-weight:700;font-size:calc(var(--u)*3.2);line-height:1.2}
.mitems{flex:1;display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:center;gap:calc(var(--ms,40px)*.12);padding:4%;overflow:hidden;min-height:0}
.mi{font-size:var(--ms,40px);line-height:1;position:relative;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;animation:pop .3s ease-out}
.mi.hl{background:#FFE48A;border-radius:30%;box-shadow:0 0 0 calc(var(--ms,40px)*.06) #E0A800}
.mi b{position:absolute;top:-.25em;right:-.35em;background:#000;color:#fff;font:700 calc(var(--ms,40px)*.42)/1.35 Andika,sans-serif;border-radius:99px;padding:0 .35em}
.k-box{background:#E9C89A;border:calc(var(--u)*.8) solid #8A5A2B;border-radius:calc(var(--u)*1.5)}
.k-box .mitems{background:#FBF0DC;margin:4%;border-radius:calc(var(--u)*1)}
.lid{position:absolute;top:-3%;left:-3%;right:-3%;bottom:-3%;background:repeating-linear-gradient(135deg,#C98F4E 0,#C98F4E calc(var(--u)*2),#BB8040 calc(var(--u)*2),#BB8040 calc(var(--u)*4));border:calc(var(--u)*.8) solid #8A5A2B;border-radius:calc(var(--u)*1.5);display:flex;align-items:center;justify-content:center;font:900 calc(var(--u)*14)/1 "Arial Black",Arial,sans-serif;color:rgba(255,255,255,.75)}
.k-sac{background:#DCE7F7;border:calc(var(--u)*.6) solid #5C7FB8;border-radius:40% 40% 14% 14%}
.k-sac.closed .lid{background:#9DB5DE;border-color:#5C7FB8;border-radius:40% 40% 14% 14%;font-size:calc(var(--u)*8)}
.k-main{background:#FCE6D6;border:calc(var(--u)*.6) solid #C98A5E;border-radius:45% 45% 30% 30%}
.k-out{border:calc(var(--u)*.5) dashed #9AA5AE;border-radius:calc(var(--u)*2)}
.k-plate{background:#fff;border:calc(var(--u)*.6) solid #9AA5AE;border-radius:50%;cursor:pointer}
.k-doll{background:#F3F6FA;border:calc(var(--u)*.5) solid #9AA5AE;border-radius:calc(var(--u)*2);cursor:pointer}
.k-doll .mlab{font-size:calc(var(--u)*7);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.k-row{flex-direction:row;align-items:center;background:#F3F6FA;border-radius:calc(var(--u)*1.5);cursor:pointer}
.k-row .mlab{width:16%;font-size:calc(var(--u)*2.8)}
.k-row .mitems{display:grid;grid-template-columns:repeat(10,1fr);justify-items:center;align-content:center;height:100%;padding:0 1%;gap:0;border-left:2px solid #D5DCE2}
.k-row .mi{font-size:calc(var(--u)*6)}
.mminus{position:absolute;top:4px;right:4px;width:calc(var(--u)*6);height:calc(var(--u)*6);min-width:34px;min-height:34px;border-radius:50%;border:3px solid #333;background:#fff;color:#000;font:700 calc(var(--u)*4)/1 Andika,sans-serif;padding:0;cursor:pointer;z-index:2}
.mtag{position:absolute;top:-14%;left:50%;transform:translateX(-50%);background:#fff;border:3px solid #000;border-radius:99px;padding:0 calc(var(--u)*2);font:700 calc(var(--u)*5)/1.3 Andika,sans-serif}
.mfly{position:fixed;z-index:80;transform:translate(-50%,-50%);transition:transform .55s ease-in-out;pointer-events:none;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.mtrack{position:absolute;left:3%;right:3%;top:50%;height:24%;display:grid;gap:calc(var(--u)*.6)}
.tcase{position:relative;border:calc(var(--u)*.45) solid #333;border-radius:calc(var(--u)*1);background:#fff;font:700 calc(var(--u)*4)/1 Andika,sans-serif;color:#000;padding:0;cursor:pointer}
.tcase:nth-child(odd){background:#EAF2FF}.tcase.sel{background:#FFE48A;border-color:#E0A800}
.pawn{position:absolute;left:50%;bottom:92%;transform:translateX(-50%);font-size:calc(var(--u)*8);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.hopn{position:absolute;top:104%;left:50%;transform:translateX(-50%);background:#000;color:#fff;border-radius:99px;padding:0 .4em;font-size:calc(var(--u)*3.4)}
.mdicebox{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-size:calc(var(--u)*7)}

function load(){try{const v=JSON.parse(localStorage.getItem("adaptprobleme"));if(!v||!v.nouns)return null;
 if(!v.cat&&v.schema)v.cat=SCH[v.schema].kind;
 if(!v.signs){v.signs={};v.qset={};v.zones={};v.n=v.schema?({trans:1,comp:2,star:4})[SCH[v.schema].kind]:1;v.qmode=false}return v}catch(e){return null}}
function push(){hist.push(JSON.stringify({zones:S.zones,n:S.n,signs:S.signs,qset:S.qset}));if(hist.length>60)hist.shift()}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("fr"));if(v)u.voice=v;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}

/* ---------- Géométrie des schémas (repère 1000 × 620) ---------- */
const DEFN={trans:1,comp:2,star:4,cmp:1},RANGE={trans:[1,4],comp:[2,5],star:[2,10]},STEPLAB={trans:"Changements",comp:"Parties",star:"Parts",cmp:""};
function defQ(id,zid,N){const k=SCH[id];
 if(k.kind==="trans"){if(k.q==="fin")return zid==="s"+N;if(k.q==="debut")return zid==="s0";return zid==="a"+(N-1)}
 if(k.kind==="comp")return k.q==="tout"?zid==="tout":zid==="p0";
 if(k.kind==="cmp")return zid===k.q;
 if(k.q==="nombre")return false;if(k.q==="part")return zid!=="centre";if(zid==="centre")return true;return k.q==="pareil"&&zid!=="p0"}
function layout(id,N,live){
 const k=SCH[id],Z=[],signs=[];let svg="",branch=null;
 const Q=zid=>(live&&S.qset&&zid in S.qset)?S.qset[zid]:defQ(id,zid,N);
 if(k.kind==="trans"){
  const T=960,wb=Math.min(275,T/((N+1)+.9*N)),wa=(T-(N+1)*wb)/N,h=Math.min(260,wb*1.35),cy=320;
  for(let i=0;i<=N;i++){const x=20+i*(wb+wa);
   Z.push({id:"s"+i,name:i===0?"Au début":i===N?"À la fin":"Après le changement "+i,x,y:cy-h/2,w:wb,h,q:Q("s"+i)});
   if(i<N){const x0=x+wb,m=wa*.05,sh=Math.min(62,h*.28),hh=Math.min(sh*1.7,h*.5),xs=x0+m,xh=x0+wa*.7,xe=x0+wa-m;
    svg+=`<polygon class="inkf" points="${xs},${cy-sh} ${xh},${cy-sh} ${xh},${cy-hh} ${xe},${cy} ${xh},${cy+hh} ${xh},${cy+sh} ${xs},${cy+sh}"/>`;
    Z.push({id:"a"+i,name:"Changement "+(i+1),x:xs+4,y:cy-sh+5,w:(xh-xs)+(xe-xh)*.35,h:2*sh-10,q:Q("a"+i),arrow:1});
    signs.push({id:"a"+i,x:x0+wa*.45,y:Math.max(28,cy-h/2-40)});}
  }
 }else if(k.kind==="cmp"){
  svg='<path class="lns" d="M385,175 L440,175 L440,445 L385,445 M440,310 L545,310"/><polygon class="inkf" points="440,165 422,200 458,200"/><polygon class="inkf" points="440,455 422,420 458,420"/>';
  Z.push({id:"p0",name:"La première quantité",x:90,y:60,w:295,h:230,q:Q("p0")});
  Z.push({id:"p1",name:"La deuxième quantité",x:90,y:330,w:295,h:230,q:Q("p1")});
  Z.push({id:"ecart",name:"La différence",x:545,y:200,w:300,h:220,q:Q("ecart")});
  signs.push({id:"ecart",x:695,y:160,cmp:1});
 }else if(k.kind==="comp"){
  svg='<path class="lns" d="M478,36 C530,36 512,100 512,160 L512,262 C512,296 522,306 552,310 C522,314 512,324 512,358 L512,460 C512,520 530,584 478,584"/>';
  const g=22,ph=(560-g*(N-1))/N,pw=N<=2?275:N<=3?300:340;
  for(let i=0;i<N;i++)Z.push({id:"p"+i,name:"Partie "+(i+1),x:455-pw,y:30+i*(ph+g),w:pw,h:ph,q:Q("p"+i)});
  Z.push({id:"tout",name:"Le tout",x:600,y:160,w:320,h:300,q:Q("tout")});
 }else{
  const cx=500,cy=325,r=118,w=N<=4?235:N<=6?190:N<=8?150:125,h=Math.round(w*.84),rx=335,ry=210;
  const start=k.q==="nombre"?270+180/N:135,parts=[];
  for(let i=0;i<N;i++){const a=(start+i*360/N)*Math.PI/180,px=cx+rx*Math.cos(a),py=cy+ry*Math.sin(a);
   svg+=`<line class="lns" x1="${cx}" y1="${cy}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}"/>`;
   parts.push({id:"p"+i,name:"Part "+(i+1),x:px-w/2,y:py-h/2,w,h,q:Q("p"+i)});}
  if(k.q==="nombre"){svg+=`<line class="lns" x1="${cx}" y1="${cy}" x2="${cx+6}" y2="100"/>`;branch={x:cx+8,y:55}}
  Z.push({id:"centre",name:"Le tout",x:cx-r,y:cy-r,w:2*r,h:2*r,q:Q("centre"),circle:1},...parts);
 }
 return{Z,svg,branch,signs};
}
function schemaSVG(id,N,live){
 const L=layout(id,N||DEFN[SCH[id].kind],live);let s=`<svg viewBox="0 0 1000 620" class="mini" aria-hidden="true">${L.svg}`;
 for(const z of L.Z){const cx=z.x+z.w/2,cy=z.y+z.h/2,qs=Math.min(z.w,z.h)*.62;
  if(!z.arrow){s+=z.circle?`<circle class="zs" cx="${cx}" cy="${cy}" r="${z.w/2-9}"/>`:`<rect class="zs" x="${z.x+9}" y="${z.y+9}" width="${z.w-18}" height="${z.h-18}" rx="16"/>`}
  if(z.q)s+=`<text class="qt${z.arrow?" inv":""}" x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="${qs}">?</text>`;}
 if(L.branch)s+=`<text class="qt" x="${L.branch.x}" y="${L.branch.y}" text-anchor="middle" dominant-baseline="central" font-size="95">?</text>`;
 return s+"</svg>";
}

function renderCat(){
 $("#main").innerHTML=`<div class="wrap"><div class="teach"><div class="tprev">${["t-fin","c-tout","k-ecart","s-tout"].map(id=>schemaSVG(id)).join("")}</div>
 <div class="ttxt"><strong>Pour l'enseignant : fiches de recherche à imprimer</strong><span>${FICHES_TXT}</span></div>
 <div class="tbtn"><a class="btn primary" href="${FICHES_PDF}" download="fiches-problemes.pdf">⬇ Télécharger le PDF</a><button class="btn" data-act="printfiches">🖨 Imprimer</button></div></div><h1>De quel type est ton problème ?</h1><p class="lead">Lis le problème et cherche les mots indices. Touche 🔊 pour écouter.</p>
 <div class="kgrid">${Object.keys(KINDS).map(k=>{const K=KINDS[k];return`<div class="card kcard${S.cat===k?" chosen":""}"><button class="pick" data-kind="${k}">${schemaSVG(KFIRST[k])}<strong class="ktitle">${K.title}</strong><span class="kdesc">${K.desc}</span></button>
 <div class="kwords"><span class="klab">Mots indices :</span>${K.keys.map(w=>`<span class="kw">${esc(w)}</span>`).join("")}</div>
 <button class="speak" data-sayk="${k}" aria-label="Écouter">🔊</button></div>`}).join("")}</div>
 <p class="lead" style="margin-top:14px">Attention : les mots indices aident à reconnaître l'histoire, pas à choisir l'opération. « Il gagne » peut cacher une soustraction ! Il faut toujours bien comprendre l'histoire.</p>
 <section class="lvlsec"><h2>Suivre une progression : choisis le niveau</h2><p class="lead">Une progression par niveau, de la PS au CM2, issue des programmes 2025, pour garder la même continuité dans toute l'école. Tu peux aussi continuer à utiliser l'application librement avec tes propres problèmes.</p><div class="lvls">${LVGROUPS.map(([g,ls])=>`<div class="lgroup"><h3>${g}</h3>${ls.map(l=>`<button class="lbtn" data-level="${l}" aria-pressed="${S.level===l}">${l}</button>`).join("")}</div>`).join("")}</div></section></div>`;
}
function renderSteps(){
 const st=[["cat","1 Le type",true],["choose","2 Le schéma",!!S.cat],["nouns","3 Les objets",!!S.schema],["ws","4 Je représente",!!S.schema&&validNouns()]];
 $("#steps").innerHTML=st.map(([k,l,ok])=>`<button data-go="${k}" ${S.screen===k?'aria-current="step"':""} ${ok?"":"disabled"}>${l}</button>`).join("");
}
function go(sc){if(sc==="ws"&&!prepNouns())return;S.screen=sc;save();render()}
function render(){renderSteps();const m=$("#main");m.scrollTop=0;
 if(S.screen==="nouns"&&S.schema)renderNouns();else if(S.screen==="ws"&&S.schema&&validNouns())renderWS();else if(S.screen==="choose"&&S.cat)renderChoose();else if(S.screen==="level"&&S.level)renderLevel();else if(S.screen==="mat"&&MAT.sc)renderMat();else{S.screen="cat";renderSteps();renderCat()}}

function renderChoose(){
 $("#main").innerHTML=`<div class="wrap"><h1>${KINDS[S.cat].title} : que cherche-t-on ?</h1><p class="lead">Choisis le schéma qui correspond à la question. Touche 🔊 pour écouter.</p>
 <div class="grid">${ORDER.filter(id=>SCH[id].kind===S.cat).map(id=>`<div class="card${S.schema===id?" chosen":""}"><button class="pick" data-pick="${id}">${schemaSVG(id)}<strong>${SCH[id].title}</strong></button>
 <div class="row"><p>${SCH[id].desc}</p><button class="speak" data-say="${id}" aria-label="Écouter">🔊</button></div></div>`).join("")}</div></div>`;
}

function renderNouns(){
 const k=SCH[S.schema];
 $("#main").innerHTML=`<div class="wrap two"><div class="recap">${schemaSVG(S.schema,S.n,true)}<strong>${k.title}</strong><p>${k.desc}</p></div>
 <div><h2 style="margin-top:0">De quoi parle le problème ?</h2><p class="lead">Choisis ce que l'on compte : des animaux, des fruits, des personnes, de l'argent…</p>
 <div id="nl"></div>${S.nouns.length<MAXN?`<button class="btn big" data-act="openpick">+ Choisir des objets ou des animaux</button>`:""}
 <p class="msg" id="msg"></p><button class="btn primary" data-go="ws">Placer les objets</button></div></div>`;
 $("#nl").innerHTML=S.nouns.map((n,i)=>`<div class="noun" style="--c:${col(i)}"><div class="nr"><button class="nico" data-repl="${i}" aria-label="Changer l'image">${n.icon?icoHTML(n.icon):`<span class="it word" style="--c:${col(i)}">Aa</span>`}</button><input value="${esc(n.name)}" aria-label="Nom de l'objet ${i+1}" data-in="${i}"><button class="btn" data-repl="${i}">Changer l'image</button><button class="btn" data-del="${i}" aria-label="Supprimer">✕</button></div></div>`).join("");
}
function renderChips(){}
function removeNoun(i){S.nouns.splice(i,1);for(const z in S.zones)S.zones[z]=S.zones[z].filter(v=>v!==i).map(v=>v>i?v-1:v);if(S.sel>=S.nouns.length)S.sel=0}
function prepNouns(){
 for(let i=S.nouns.length-1;i>=0;i--){const n=S.nouns[i];if(!n.name.trim()&&!n.icon&&S.nouns.length>1)removeNoun(i)}
 if(!validNouns()){const m=$("#msg");if(m)m.textContent="Choisis au moins un objet.";return false}
 if(S.sel>=S.nouns.length)S.sel=0;return true;
}

function itemHTML(n,i,d){const o=S.nouns[n];if(!o)return"";
 if(S.stage==="cube")return`<span class="it cube" data-i="${i}" style="--d:${d}"></span>`;
 return o.icon?icoHTML(o.icon,"",`data-i="${i}" style="--d:${d}"`):`<span class="it word" data-i="${i}" style="--c:${col(n)};--d:${d}">${esc(o.name)}</span>`}
function itemsHTML(list){
 if(S.stage==="cube"){const srt=list.map((n,i)=>[n,i]).sort((a,b)=>a[0]-b[0]);const c=srt.map(([n,i],j)=>itemHTML(n,i,Math.min(j,40)));
  if(S.group10){const full=Math.floor(c.length/10),hb=Math.floor(c.length/100)*10;let o="";
   for(let b=0;b<full;b++)o+=`<span class="bar${b<hb?" hund":""}">${c.slice(b*10,b*10+10).join("")}</span>`;
   if(c.length%10)o+=`<span class="loose">${c.slice(full*10).join("")}</span>`;return o}return c.join("")}
 const it=list.map((n,i)=>itemHTML(n,i,Math.min(i,40)));
 if(S.group10&&list.length>10){let o="";for(let b=0;b<it.length;b+=10)o+=`<span class="ten">${it.slice(b,b+10).join("")}</span>`;return o}
 return it.join("");
}
function zoneHTML(z){
 const list=S.zones[z.id]||[],m=Math.min(z.w,z.h);
 const st=`left:${z.x/10}%;top:${z.y/6.2}%;width:${z.w/10}%;height:${z.h/6.2}%;--qs:calc(var(--u)*${(m*.062).toFixed(2)});--ns:calc(var(--u)*${(m*(z.arrow?.075:.05)).toFixed(2)})`;
 let inner="";
 if(S.stage==="cdu"){const n=list.length;
  if(!n&&z.q)inner='<div class="qm">?</div>';
  else{const c=Math.floor(n/100),d=Math.floor(n%100/10),u=n%10;
   inner=`<div class="b10" data-c="${c}" data-d="${d}" data-u="${u}">${'<span class="h"></span>'.repeat(c)}${'<span class="t"></span>'.repeat(d)}${u?`<span class="dice" aria-label="${u} unités">${(u<=5?[u]:[5,u-5]).map(v=>`<span class="uw">${DIE[v].map(on=>on?'<span class="u"></span>':'<span class="ue"></span>').join("")}</span>`).join("")}</span>`:""}</div>`}
  if(S.showNums&&n)inner+=`<span class="badge">${n}</span>`}
 else if(S.stage==="num"){let t;if(!list.length&&z.q)t="?";else t=String(list.length);if(z.arrow&&t!=="?")t=(S.signs[z.id]==="-"?"− ":"+ ")+t;inner=`<div class="bignum${t==="?"?" q":""}">${t}</div>`}
 else{if(z.q)inner+='<div class="qm">?</div>';inner+=`<div class="items">${itemsHTML(list)}</div>`;if(S.showNums&&list.length)inner+=`<span class="badge">${list.length}</span>`}
 return`<div class="zone${z.circle?" circle":""}${z.arrow?" arrow":""}${z.arrow&&S.signs[z.id]==="-"?" minus":""}${S.qmode?" qedit":""}" data-z="${z.id}" style="${st}" tabindex="0" role="button" aria-label="${esc(z.name)}${z.q?", ce que je cherche":""}">${inner}</div>`;
}
function stageHTML(){
 const L=layout(S.schema,S.n,true);let h=`<svg viewBox="0 0 1000 620" aria-hidden="true">${L.svg}</svg>`+L.Z.map(zoneHTML).join("");
 L.signs.forEach(g=>{const m=S.signs[g.id]==="-";h+=`<button class="sign" style="left:${g.x/10}%;top:${g.y/6.2}%;font-size:calc(var(--u)*${S.n>2?1.7:2.3})" data-sign="${g.id}">${g.cmp?(m?"− de moins":"+ de plus"):(m?"− on enlève":"+ on ajoute")}</button>`});
 if(L.branch){const n=S.stage==="num";h+=`<div class="branchq${n?" n":""}" style="left:${L.branch.x/10}%;top:${L.branch.y/6.2}%">${n?S.n+" parts":"?"}</div>`}
 return h;
}
function paletteHTML(){

  return`<button class="tok" data-tok="${i}" aria-pressed="${S.sel===i}">${ic}${esc(o.name)}</button>`}).join("")+
  `<span class="stepseg" role="group" aria-label="Nombre d'objets posés à chaque fois">Poser :${[1,5,10].map(v=>`<button data-step="${v}" aria-pressed="${(S.step||1)===v}">${v}</button>`).join("")}</span>`+

 else{
  if(s.type==="cmp"){const J=cont(s,"jul");if(J.items.length!==s.ans){MAT.msg=`Julie doit avoir ${s.d} bille${s.d>1?"s":""} de plus que Pierre. Regarde !`;renderMtxt();say(MAT.msg);await sleep(1600);
    while(J.items.length<s.ans){await fly(s,"res","jul");cont(s,"res").items.push({e:"🔵"})}while(J.items.length>s.ans)await fly(s,"jul","res")}
   J.items.forEach((it,j)=>it.hl=j>=s.a);renderMStage()}
  const ids=s.type==="share"?["d0"]:s.type==="cmp"?["jul"]:s.check;
  ids.forEach(id=>{const c=cont(s,id);c.closed=false;c.tag=null});renderMStage();await sleep(600);let n=0;
  for(const id of ids)for(const it of cont(s,id).items){if(s.onlyHl&&!it.hl)continue;n++;it.cn=n;renderMStage();say(String(n));await sleep(720)}
 }
 MAT.ok=MAT.ans===s.ans;MAT.msg=(MAT.ok?"Bravo ! ":`Tu avais dit ${MAT.ans}. `)+s.sol+(MAT.ok?"":" On essaie avec d'autres nombres ?");
 MAT.phase="done";MAT.busy=false;renderMtxt();say(MAT.msg)}
async function mTap(e){const s=MAT.sc;if(!s||MAT.busy)return;
 const cs=e.target.closest("[data-mcase]");if(cs&&s.type==="track"&&MAT.phase==="q"){MAT.ans=+cs.dataset.mcase;renderMStage();renderMtxt();return}
 if(MAT.phase!=="manip")return;const mm=e.target.closest("[data-mminus]");const ce=e.target.closest("#mstage [data-c]");if(!ce)return;const id=ce.dataset.c;MAT.busy=true;MAT.msg="";
 if(mm){await fly(s,mm.dataset.mminus,"res")}
 else if(s.type==="share"){if(id.startsWith("d"))await fly(s,"res",id)}
 else if(s.type==="cmp"){if((id==="res"||id==="jul")&&cont(s,"jul").items.length<10){await fly(s,"res","jul");cont(s,"res").items.push({e:"🔵"});renderMStage()}}
 MAT.busy=false;renderMtxt()}
document.addEventListener("click",e=>{
 const lv=e.target.closest("[data-level]");if(lv){S.level=lv.dataset.level;S.screen="level";save();render();return}
 const si=e.target.closest("[data-stepi]");if(si){if(isMat(S.level))openMat(+si.dataset.stepi);else startStep(+si.dataset.stepi);return}
 const sx=e.target.closest("[data-sayex]");if(sx){say(LEVELS[S.level].steps[+sx.dataset.sayex].ex);return}
 if(S.screen!=="mat"||!MAT.sc)return;
 const a=e.target.closest("[data-mact]");if(a){const v=a.dataset.mact;
  if(v==="next")mNext();else if(v==="done")mDone();else if(v==="verify")mVerify();else if(v==="new"&&!MAT.busy)newMat();
  else if(v==="say")say(MAT.sc.story.slice(0,MAT.i+1).map(x=>x.txt).join(" ")+(["q","check","done"].includes(MAT.phase)?" "+MAT.sc.q:MAT.phase==="manip"?" "+MAT.sc.manip:""));return}
 const an=e.target.closest("[data-mans]");if(an&&MAT.phase==="q"){MAT.ans=+an.dataset.mans;renderMtxt();return}
 mTap(e);
});
addEventListener("resize",()=>{if(S.screen==="mat")requestAnimationFrame(sizeM)});

addEventListener("resize",()=>requestAnimationFrame(fit));
/* ---------- Choix des objets ---------- */
const P={open:false,mode:"add",idx:-1,cat:CATS[0],q:"",web:null,webQ:"",webMsg:"",timer:0,props:[],over:{},skip:{},best:{}};
function bestMatch(w,prefix){const n=norm(w);if(n.length<2)return null;
 return DB.find(e=>norm(e.name)===n)||DB.find(e=>e.keys.includes(n))||(prefix&&n.length>=3?DB.find(e=>e.keys.some(k=>k.startsWith(n))):null)}
function parseMulti(q){const out=[];
 q.split(/[,;\n]+/).forEach(seg=>{seg=seg.trim();if(!seg)return;
  if(/\s/.test(seg)){const whole=bestMatch(seg,false);if(whole){out.push({w:seg,e:whole});return}
   seg.split(/\s+/).forEach(w=>{const n=norm(w);if(n.length<2||STOP.includes(n))return;out.push({w,e:bestMatch(w,true)})})}
  else{const n=norm(seg);if(n.length<2||STOP.includes(n))return;out.push({w:seg,e:bestMatch(seg,true)})}});
 return out}
function propsList(){return P.props.map((p,i)=>{const o=P.over[i];if(o)return{icon:o.icon,name:o.name};if(p.e)return{icon:p.e.icon,name:p.e.name};
  const b=P.best[norm(p.w)];return{icon:b?"img:"+b:null,name:p.w,wait:b===undefined}})}
async function fetchBest(w){const k=norm(w);if(k in P.best)return;P.best[k]=undefined;
 try{const r=await fetch("https://api.arasaac.org/api/pictograms/fr/search/"+encodeURIComponent(w.toLowerCase()));const js=r.ok?await r.json():[];
  P.best[k]=Array.isArray(js)&&js.length?`https://static.arasaac.org/pictograms/${js[0]._id}/${js[0]._id}_300.png`:null}catch(e){P.best[k]=null}
 if(P.open)renderPick()}
function openPick(mode,idx){P.open=true;P.props=[];P.over={};P.skip={};P.mode=mode;P.idx=idx;P.q="";P.web=null;P.webMsg="";const m=$("#picker");m.hidden=false;$("#psearch").value="";
 $("#ptitle").textContent=mode==="repl"?"Choisis une nouvelle image":"Touche les objets du problème";renderPick();setTimeout(()=>$("#psearch").focus(),50)}
function closePick(ok){
 if(ok&&P.mode==="add"){propsList().forEach((p,i)=>{if(P.skip[i]||S.nouns.length>=MAXN)return;
  if(p.icon?S.nouns.some(n=>n.icon===p.icon):S.nouns.some(n=>!n.icon&&n.name===p.name))return;
  S.nouns.push({name:p.name,icon:p.icon,auto:false});S.sel=S.nouns.length-1});save()}
 P.open=false;$("#picker").hidden=true;clearTimeout(P.timer);if(S.screen==="nouns")renderNouns();else if(S.screen==="ws"&&$("#pal")){$("#pal").innerHTML=paletteHTML()}renderSteps()}
function tileHTML(icon,name){const has=P.mode==="add"&&icon&&S.nouns.some(n=>n.icon===icon);
 return`<button class="tile${has?" has":""}" data-tile="${esc(icon)}" data-name="${esc(name)}">${icoHTML(icon)}<span>${esc(name)}</span></button>`}
function renderPick(fromTyping){
 const q=P.q.trim();$("#pcats").innerHTML=CATS.map(c=>`<button class="chip txt" data-cat="${esc(c)}" aria-pressed="${!q&&P.cat===c}">${DB.find(e=>e.cat===c).icon} ${c}</button>`).join("");
 let list;
 if(q&&P.mode==="add"){const old=JSON.stringify(P.props.map(p=>p.w));P.props=parseMulti(q);if(JSON.stringify(P.props.map(p=>p.w))!==old){P.over={};P.skip={}}
  const seen=new Set();list=[];P.props.forEach(p=>searchLocal(p.w).forEach(e=>{if(!seen.has(e.icon)){seen.add(e.icon);list.push(e)}}));
  P.props.forEach(p=>{if(!p.e&&norm(p.w).length>=3)fetchBest(p.w)});
 }else{P.props=[];list=q?searchLocal(q):DB.filter(e=>e.cat===P.cat)}
 const pl=propsList();
 $("#pprop").innerHTML=pl.length?`<div class="prop"><b>Je vais ajouter :</b>${pl.map((p,i)=>`<button class="tile${P.skip[i]?" off":" has"}" data-prop="${i}" aria-pressed="${!P.skip[i]}">${p.wait?`<span class="it word" style="--c:var(--line)">…</span>`:p.icon?icoHTML(p.icon):`<span class="it word" style="--c:var(--c0)">Aa</span>`}<span>${esc(p.name)}</span></button>`).join("")}<span class="ptip">Touche un dessin pour le retirer. Touche un dessin plus bas pour le remplacer. Puis appuie sur OK.</span></div>`:"";
 let h=list.map(e=>tileHTML(e.icon,e.name)).join("");
 if(q&&!list.length)h=`<p class="empty">« ${esc(q)} » n'est pas dans la banque d'images.</p>`;
 $("#pgrid").innerHTML=h;
 let w="";
 if(q&&P.props.length<=1){w+=`<div class="webbar"><button class="btn" data-act="web">🌐 Chercher « ${esc(q)} » sur Internet</button><button class="btn" data-act="useword">Écrire seulement le mot « ${esc(q)} »</button></div>`;
  if(P.web&&P.webQ===q)w+=P.web.length?`<div class="pgrid">${P.web.map(u=>tileHTML("img:"+u,q)).join("")}</div>`:"";
  if(P.webMsg&&P.webQ===q)w+=`<p class="empty">${P.webMsg}</p>`}
 $("#pweb").innerHTML=w;
 if(fromTyping){clearTimeout(P.timer);if(P.props.length<=1&&q.length>=3&&list.length<2&&P.webQ!==q)P.timer=setTimeout(webSearch,700)}
}
async function webSearch(){const q=P.q.trim();if(!q)return;clearTimeout(P.timer);P.webQ=q;P.web=null;P.webMsg="Recherche sur Internet…";renderPick();
 try{const r=await fetch("https://api.arasaac.org/api/pictograms/fr/search/"+encodeURIComponent(q.toLowerCase()));
  if(P.webQ!==q)return;
  if(!r.ok){P.web=[];P.webMsg="Aucune image trouvée sur Internet pour ce mot. Essaie au singulier ou un autre mot.";renderPick();return}
  const js=await r.json();P.web=(Array.isArray(js)?js:[]).slice(0,24).map(p=>`https://static.arasaac.org/pictograms/${p._id}/${p._id}_300.png`);
  P.webMsg=P.web.length?"":"Aucune image trouvée sur Internet pour ce mot. Essaie au singulier ou un autre mot.";
 }catch(e){if(P.webQ!==q)return;P.web=[];P.webMsg="Impossible de joindre Internet. Vérifie la connexion."}
 renderPick()}
function pickTile(icon,name){icon=icon||null;
 if(P.mode==="add"&&P.props.length&&icon){const e=DB.find(x=>x.icon===icon);let i=-1;
  if(e)i=P.props.findIndex(p=>{const n=norm(p.w);return e.keys.some(k=>k.startsWith(n)||(n.length>=4&&n.startsWith(k)))});
  else if(isImg(icon))i=P.props.findIndex(p=>p.w===name);
  if(i>=0){P.over[i]={icon,name};P.skip[i]=false;renderPick();return}}
 if(P.mode==="repl"){const n=S.nouns[P.idx];if(n){const old=n.icon;n.icon=icon;const oldName=(DB.find(e=>e.icon===old)||{}).name;if(!n.name.trim()||n.name===oldName||isImg(old))n.name=name}save();closePick();return}
 const at=icon?S.nouns.findIndex(n=>n.icon===icon):S.nouns.findIndex(n=>!n.icon&&n.name===name);
 if(at>=0){const used=Object.values(S.zones).some(l=>l.includes(at));if(!used){removeNoun(at);save()}}
 else{if(S.nouns.length>=MAXN){alert("10 objets au maximum.");return}S.nouns.push({name,icon,auto:false});S.sel=S.nouns.length-1;save()}
 renderPick()}
try{speechSynthesis.getVoices()}catch(e){}
render();
</script>
