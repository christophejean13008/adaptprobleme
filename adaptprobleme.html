<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adaptproblème</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECF1;--ui:#FFFFFF;--paper:#FFFFFF;--ink:#000000;--muted:#55616C;--line:#C9D3DB;--hi:#F2B705;--hi-soft:#FFF3C4;
  --c0:#2F6FDE;--c1:#D7263D;--c2:#2A9D5C;--c3:#E9A800;--c4:#7B4FC9;--c5:#E76F1C;--c6:#1A9BA8;--c7:#8A5A2B;--c8:#C2185B;--c9:#5C6BC0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191D;--ui:#20262C;--paper:#262D34;--ink:#F3F5F7;--muted:#A5B0BA;--line:#3A444D;--hi-soft:#4A3E12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15191D;--ui:#20262C;--paper:#262D34;--ink:#F3F5F7;--muted:#A5B0BA;--line:#3A444D;--hi-soft:#4A3E12;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Andika,"Trebuchet MS",Verdana,sans-serif;font-size:18px;line-height:1.4}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--c0);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:22px;display:flex;align-items:center;gap:10px}
.brand svg{width:52px;height:30px}
.steps{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.steps button{border:2px solid var(--line);background:var(--ui);border-radius:999px;padding:4px 14px;font-size:16px}
.steps button[aria-current="step"]{border-color:var(--ink);font-weight:700}
.steps button:disabled{opacity:.45;cursor:default}
.btn{border:2px solid var(--line);background:var(--ui);border-radius:10px;padding:6px 12px;font-size:17px}
.btn.on{border-color:var(--ink);background:var(--hi-soft)}
.btn.primary{background:var(--c0);border-color:var(--c0);color:#fff;font-weight:700;padding:10px 20px}
.btn:disabled{opacity:.4;cursor:default}
main{flex:1;min-height:0;overflow:auto;padding:0 16px 16px}
.wrap{max-width:1300px;margin:0 auto}
h1{font-size:28px;margin:6px 0 4px;line-height:1.2}
h2{font-size:22px;margin:18px 0 4px}
.lead{color:var(--muted);margin:0 0 16px;max-width:62ch}
.speak{border:2px solid var(--line);background:var(--ui);border-radius:10px;padding:2px 10px;font-size:20px;line-height:1.3;flex:none}

/* Choix du schéma */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--ui);border:3px solid transparent;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card:has(.pick:hover){border-color:var(--line)}
.card.chosen{border-color:var(--ink)}
.pick{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.mini{width:100%;height:auto;display:block}
.pick strong{font-size:19px;line-height:1.25}
.card .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.card p{margin:0;color:var(--muted);font-size:15px}

/* SVG schéma */
.inkf{fill:var(--ink)}
.lns{stroke:var(--ink);stroke-width:16;fill:none;stroke-linecap:round}
.zs{fill:var(--paper);stroke:var(--ink);stroke-width:18}
.qt{fill:var(--ink);font-family:"Arial Black",Arial,sans-serif;font-weight:900}
.qt.inv{fill:var(--paper)}

/* Écran objets */
.two{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:24px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.recap{background:var(--ui);border-radius:14px;padding:14px;position:sticky;top:0}
.recap strong{display:block;font-size:19px;margin-top:8px}
.recap p{margin:4px 0 0;color:var(--muted);font-size:15px}
textarea{width:100%;min-height:80px;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--ui);resize:vertical;font-size:18px}
label.lab{font-weight:700;display:block;margin-bottom:6px}
.noun{background:var(--ui);border-radius:14px;padding:12px;margin-bottom:12px;border-left:8px solid var(--c)}
.nr{display:flex;gap:8px;align-items:center}
.nr input{flex:1;min-width:0;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:20px;background:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:3px solid var(--line);background:var(--paper);border-radius:12px;min-width:52px;height:52px;font-size:30px;display:grid;place-items:center;padding:0 8px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",Andika,sans-serif}
.chip.txt{font-size:16px;font-family:inherit}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.more{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:2px dashed var(--line)}
.more .chip{min-width:44px;height:44px;font-size:24px;border-width:2px}
.msg{color:var(--c1);font-weight:700;min-height:1.4em}

/* Espace de travail */
.ws{display:flex;flex-direction:column;height:100%;gap:8px}
.wsbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wtitle{font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--ui);border-radius:12px;padding:3px;border:2px solid var(--line);margin-left:auto}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;font-weight:700;font-size:17px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.enonce{background:var(--ui);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:flex-start;font-size:19px}
.enonce div{flex:1;white-space:pre-wrap}
.stagewrap{flex:1;min-height:240px;display:flex;align-items:center;justify-content:center;position:relative}
.stage{position:relative;width:600px;height:372px;--u:6px;user-select:none;-webkit-user-select:none;flex:none}
.stage>svg{position:absolute;left:0;top:0;width:100%;height:100%}
.zone{position:absolute;background:var(--paper);border:calc(var(--u)*1.2) solid var(--ink);border-radius:calc(var(--u)*1.6);touch-action:none;cursor:copy;transition:box-shadow .15s}
.zone.circle{border-radius:50%}
.zone.arrow{background:transparent;border:0;border-radius:0}
.zone.over{box-shadow:0 0 0 calc(var(--u)*1) var(--hi)}
.zone.arrow.over{box-shadow:none;outline:calc(var(--u)*1) solid var(--hi)}
.qm{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font:900 var(--qs)/1 "Arial Black",Arial,sans-serif;color:var(--line);pointer-events:none}
.zone.arrow .qm{color:var(--paper);opacity:.5}
.items{position:absolute;top:calc(var(--u)*.9);right:calc(var(--u)*.9);bottom:calc(var(--u)*.9);left:calc(var(--u)*.9);display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:center;gap:calc(var(--s,40px)*.1);overflow:hidden}
.zone.circle .items{top:15%;right:15%;bottom:15%;left:15%}
.it{width:var(--s,40px);height:var(--s,40px);display:grid;place-items:center;line-height:1;touch-action:none;cursor:grab;flex:none}
.it.emo{font-size:calc(var(--s,40px)*.84);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.it.word{width:auto;padding:0 .4em;font-size:calc(var(--s,40px)*.42);border:max(2px,calc(var(--s,40px)*.06)) solid var(--c);border-radius:.5em;background:var(--paper);color:var(--ink);font-weight:700;white-space:nowrap}
.it.cube{background:var(--c);border-radius:calc(var(--s,40px)*.14);box-shadow:inset calc(var(--s,40px)*-.1) calc(var(--s,40px)*-.1) 0 rgba(0,0,0,.25),inset calc(var(--s,40px)*.07) calc(var(--s,40px)*.07) 0 rgba(255,255,255,.35)}
.bar{display:flex;flex-direction:column-reverse;gap:1px;padding:1px;background:var(--ink);border-radius:3px}
.zone.arrow .bar{background:var(--paper)}
.bar .cube{border-radius:1px}
.it.lifted{opacity:.25}
.zone.arrow .it.emo{background:var(--paper);border-radius:50%;font-size:calc(var(--s,40px)*.7)}
.bignum{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font-weight:700;font-size:var(--ns);pointer-events:none}
.zone.arrow .bignum{color:var(--paper)}
.bignum.q{font-family:"Arial Black",Arial,sans-serif}
.badge{position:absolute;top:calc(var(--u)*-2);right:calc(var(--u)*-2);min-width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);border-radius:99px;background:var(--hi);color:#000;font-weight:700;display:grid;place-items:center;font-size:calc(var(--u)*2.7);padding:0 calc(var(--u)*1);border:calc(var(--u)*.4) solid var(--ink);pointer-events:none}
.sign{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--u)*2.3);border:calc(var(--u)*.4) solid var(--ink);background:var(--paper);border-radius:99px;padding:calc(var(--u)*.3) calc(var(--u)*1.8);font-weight:700;white-space:nowrap}
.branchq{position:absolute;transform:translate(-50%,-50%);font:900 calc(var(--u)*8)/1 "Arial Black",Arial,sans-serif;pointer-events:none}
.branchq.n{font-family:Andika,sans-serif;font-weight:700;font-size:calc(var(--u)*6)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .grow{flex:1}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--ui);border:2px solid var(--line);border-radius:10px;padding:2px 6px}
.stepper button{border:0;background:var(--bg);border-radius:8px;width:34px;height:32px;font-size:20px;font-weight:700}
.palette{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ui);border-radius:14px;padding:8px 12px}
.palette .hint{color:var(--muted);font-size:15px;flex:1;min-width:200px}
.tok{display:flex;align-items:center;gap:8px;border:3px solid var(--line);border-radius:12px;background:var(--paper);padding:4px 14px 4px 6px;touch-action:none;font-size:18px;font-weight:700;--s:42px}
.tok[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tok .it{cursor:grab}
.padd{display:flex;gap:6px;align-items:center}
.padd input{width:170px;border:2px solid var(--line);border-radius:10px;padding:7px 10px;font-size:17px;background:var(--paper)}
.zone.qedit{outline:calc(var(--u)*.5) dashed var(--c1);outline-offset:calc(var(--u)*.6)}
.it.pic img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}
.zone.arrow .it.pic{background:#fff;border-radius:18%;padding:6%}
.btn.big{font-size:20px;padding:12px 18px;border-color:var(--ink);font-weight:700;margin:4px 0 8px}
.nico{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:4px;--s:46px;flex:none}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--ui);border-radius:18px;width:min(1100px,100%);max-height:100%;min-height:min(560px,100%);overflow:auto;padding:16px 18px}
.mhead{display:flex;align-items:center;gap:12px;justify-content:space-between;position:sticky;top:-16px;background:var(--ui);padding:6px 0;z-index:1}
.mhead h2{margin:0}
#psearch{width:100%;font-size:24px;border:3px solid var(--ink);border-radius:12px;padding:10px 14px;margin:8px 0;background:var(--paper)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cats .chip{height:44px;font-size:17px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-bottom:10px}
.tile{border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;--s:64px;font-size:16px;line-height:1.2;position:relative;cursor:pointer}
.tile .it{cursor:pointer}
.tile.has{border-color:var(--c2);background:var(--hi-soft)}
.tile.has::after{content:"✓";position:absolute;top:4px;right:6px;background:var(--c2);color:#fff;border-radius:99px;width:26px;height:26px;display:grid;place-items:center;font-weight:700}
.prop{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--hi-soft);border-radius:14px;padding:10px;margin:0 0 10px}
.prop .tile{width:112px}
.tile.off{opacity:.4}
.ptip{color:var(--muted);font-size:15px;flex:1;min-width:200px}
.webbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.empty{color:var(--muted);margin:6px 0;grid-column:1/-1}
.credit{color:var(--muted);font-size:13px;margin:10px 0 0}
.calc{display:flex;gap:12px;flex-wrap:wrap;background:var(--ui);border-radius:14px;padding:10px 12px;align-items:center}
.calc label{font-weight:700;display:flex;align-items:center;gap:8px;flex:1;min-width:240px}
.calc input{flex:1;min-width:0;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:24px;background:var(--paper)}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:99;transform:translate(-50%,-50%) scale(1.15);--s:58px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.anim .it{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--d,0)*18ms)}
.it.new{animation:pop .25s cubic-bezier(.3,1.5,.5,1) both}
@media (prefers-reduced-motion:reduce){.anim .it,.it.new{animation:none}}
@media (max-width:600px){.seg{margin-left:0}.wtitle{font-size:17px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 104 60" aria-hidden="true"><rect x="4" y="12" width="34" height="34" rx="5" class="zs" style="stroke-width:6"/><polygon class="inkf" points="42,22 62,22 62,14 76,29 62,44 62,36 42,36"/><rect x="72" y="12" width="28" height="34" rx="5" class="zs" style="stroke-width:6;display:none"/><rect x="78" y="12" width="22" height="34" rx="5" class="zs" style="stroke-width:6"/></svg>
      Adaptproblème <small style="font-weight:400;font-size:14px;color:var(--muted)">version 6</small>
    </div>
    <nav class="steps" id="steps" aria-label="Étapes"></nav>
    <button class="btn" id="reset">Nouveau problème</button>
  </header>
  <main id="main"></main>
</div>
<div class="modal" id="picker" hidden role="dialog" aria-modal="true" aria-labelledby="ptitle"><div class="mbox">
 <div class="mhead"><h2 id="ptitle">Touche les objets du problème</h2><button class="btn primary" data-act="pdone">OK</button></div>
 <input id="psearch" type="search" placeholder="🔎 Écris un ou plusieurs noms : vache, cochon, lion…" autocomplete="off">
 <div id="pprop"></div>
 <div class="cats" id="pcats"></div><div class="pgrid" id="pgrid"></div><div id="pweb"></div>
 <p class="credit">Images d'Internet : pictogrammes ARASAAC (auteur Sergio Palao, Gouvernement d'Aragon), licence CC BY-NC-SA.</p>
</div></div>
<script>
"use strict";
const SCH={
 "t-fin":{kind:"trans",q:"fin",title:"Je cherche la fin",desc:"Au début, il y a des objets. Puis on en ajoute ou on en enlève. Je cherche combien il y en a à la fin."},
 "t-debut":{kind:"trans",q:"debut",title:"Je cherche le début",desc:"Je sais ce qui a changé et combien il y en a à la fin. Je cherche combien il y en avait au début."},
 "t-change":{kind:"trans",q:"change",title:"Je cherche ce qui a changé",desc:"Je sais combien il y en avait au début et à la fin. Je cherche combien on en a ajouté ou enlevé."},
 "c-tout":{kind:"comp",q:"tout",title:"Deux parties : je cherche le tout",desc:"Deux parties forment un tout. Je connais les deux parties. Je cherche le tout."},
 "c-partie":{kind:"comp",q:"p1",title:"Deux parties : je cherche une partie",desc:"Je connais le tout et une partie. Je cherche l'autre partie."},
 "s-tout":{kind:"star",q:"centre",title:"Plusieurs parts : je cherche le tout",desc:"Plusieurs parts forment le tout. Je connais toutes les parts. Je cherche le tout."},
 "s-parts":{kind:"star",q:"pareil",title:"Parts pareilles : je cherche le tout",desc:"Toutes les parts sont pareilles. Je connais une part. Je cherche les autres parts et le tout."},
 "s-nombre":{kind:"star",q:"nombre",title:"Je cherche le nombre de parts",desc:"Je connais le tout et ce qu'il y a dans une part. Je cherche combien de parts on peut faire."}
};
const ORDER=Object.keys(SCH);

const DICT=[
[["vache","veau","taureau","boeuf"],"🐄 🐮"],[["cochon","porc"],"🐖 🐷"],[["mouton","brebis","agneau"],"🐑"],[["chevre"],"🐐"],
[["poule","poussin","coq","poulet"],"🐔 🐤"],[["chien","chiot"],"🐕 🐶"],[["chat","chaton"],"🐈 🐱"],[["cheval","chevaux","poney"],"🐎 🐴"],
[["lapin"],"🐇 🐰"],[["oiseau","oiseaux","pigeon","moineau"],"🐦 🕊️"],[["poisson"],"🐟 🐠"],[["canard"],"🦆"],[["souris"],"🐭"],
[["grenouille"],"🐸"],[["papillon"],"🦋"],[["abeille"],"🐝"],[["fourmi"],"🐜"],[["escargot"],"🐌"],[["coccinelle"],"🐞"],
[["animal","animaux","bete"],"🐾 🐄 🐑"],
[["euro","argent","piece","monnaie","sou","centime","prix","payer","achat","acheter","depense"],"🪙 💶 💰"],[["billet"],"💶 💵"],
[["eleve","enfant","fille","garcon","ami","copain","copine","camarade","joueur","bebe","frere","soeur"],"🧒 👧 👦"],
[["personne","gens","passager","voyageur","client","spectateur","invite","adulte","homme","femme","monsieur","dame","maitre","maitresse"],"🧍 🧑 👩 👨"],
[["bus","car","autocar"],"🧍 🚌"],[["voiture","auto"],"🚗 🚙"],[["camion"],"🚚"],[["velo"],"🚲"],[["train","wagon"],"🚆 🚃"],[["avion"],"✈️"],[["bateau"],"⛵ 🚤"],
[["chaise","place","siege","banc","table"],"🪑"],
[["pomme"],"🍎 🍏"],[["banane"],"🍌"],[["orange","clementine","mandarine"],"🍊"],[["fraise"],"🍓"],[["poire"],"🍐"],[["cerise"],"🍒"],[["raisin"],"🍇"],[["citron"],"🍋"],
[["fruit"],"🍎 🍌 🍐"],[["tomate"],"🍅"],[["carotte"],"🥕"],[["legume","salade"],"🥕 🥬"],
[["bonbon","sucette","friandise"],"🍬 🍭"],[["gateau","tarte","part"],"🍰 🧁 🎂"],[["biscuit","cookie","gaufre"],"🍪"],[["chocolat"],"🍫"],
[["oeuf"],"🥚"],[["pain","baguette","croissant"],"🥖 🥐"],[["pizza"],"🍕"],[["glace"],"🍦"],[["bouteille","jus","boisson"],"🧃 🍼"],[["verre","lait"],"🥛"],
[["fleur","rose","tulipe","bouquet"],"🌸 🌷 🌻"],[["arbre","sapin"],"🌳 🌲"],[["feuille"],"🍃"],
[["livre","album"],"📕 📚"],[["crayon","stylo","feutre"],"✏️ 🖍️ 🖊️"],[["cahier","carnet"],"📒 📓"],[["regle","gomme","trousse"],"📏"],
[["bille","perle"],"🔵 🟢 🟣"],[["ballon","balle"],"⚽ 🏀"],[["jouet","peluche","nounours"],"🧸"],
[["carte","image","vignette","autocollant","timbre"],"🃏 🖼️"],[["cadeau","paquet"],"🎁"],[["etoile"],"⭐"],[["coquillage"],"🐚"],
[["boite","carton","caisse"],"📦"],[["sac","cartable"],"🎒"],[["chaussure","basket"],"👟"],[["chaussette"],"🧦"],[["vetement","pull","habit"],"👕"],
[["maison","immeuble"],"🏠"],[["ticket","entree"],"🎟️"],[["jeton","point"],"⚪ 🟡"],[["marron","chataigne"],"🌰"],[["champignon"],"🍄"],[["cle"],"🔑"],[["bougie"],"🕯️"]
];
const GENERIC=["⚪","🔵","🟥","⭐","❤️"];
function norm(w){w=w.toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"");if(w.length>3&&/[sx]$/.test(w))w=w.slice(0,-1);return w}
const NDICT=DICT.map(([k,e])=>[k.map(norm),e.split(" ")]);
const ALL=[...new Set(NDICT.flatMap(d=>d[1]).concat(GENERIC))];

const STOP=["de","du","des","la","le","les","un","une","d","l","a","au","aux","en","et","ou","avec"];
const DB=[];const CATS=Object.keys(DBRAW);
CATS.forEach(c=>DBRAW[c].split(";").forEach(e=>{const sp=e.indexOf(" "),icon=e.slice(0,sp),rest=e.slice(sp+1).split("|"),name=rest[0],syn=rest[1]?rest[1].split(","):[];
 const keys=[];[name,...syn].forEach(w=>{const full=norm(w);if(full)keys.push(full);w.split(/[\s'’\-]+/).map(norm).filter(t=>t.length>1&&!STOP.includes(t)).forEach(t=>keys.push(t))});
 DB.push({icon,name,cat:c,keys})}));
function searchLocal(q){const toks=q.split(/[\s'’\-,]+/).map(norm).filter(t=>t.length>1&&!STOP.includes(t));if(!toks.length)return[];
 const hit=(e,t)=>e.keys.some(k=>k.startsWith(t)||(t.length>=4&&t.startsWith(k)&&t.length-k.length<=3));
 const uniq=l=>{const seen=new Set();return l.filter(e=>!seen.has(e.icon)&&seen.add(e.icon))};
 const all=uniq(DB.filter(e=>toks.every(t=>hit(e,t))));return all.length?all:uniq(DB.filter(e=>toks.some(t=>hit(e,t))))}

const DEFN={trans:1,comp:2,star:4},RANGE={trans:[1,4],comp:[2,5],star:[2,10]},STEPLAB={trans:"Changements",comp:"Parties",star:"Parts"};
function defQ(id,zid,N){const k=SCH[id];
 if(k.kind==="trans"){if(k.q==="fin")return zid==="s"+N;if(k.q==="debut")return zid==="s0";return zid==="a"+(N-1)}
 if(k.kind==="comp")return k.q==="tout"?zid==="tout":zid==="p0";
 if(k.q==="nombre")return false;if(zid==="centre")return true;return k.q==="pareil"&&zid!=="p0"}
function layout(id,N,live){
 const k=SCH[id],Z=[],signs=[];let svg="",branch=null;
 const Q=zid=>(live&&S.qset&&zid in S.qset)?S.qset[zid]:defQ(id,zid,N);
 if(k.kind==="trans"){
  const T=960,wb=Math.min(275,T/((N+1)+.9*N)),wa=(T-(N+1)*wb)/N,h=Math.min(260,wb*1.35),cy=320;
  for(let i=0;i<=N;i++){const x=20+i*(wb+wa);
   Z.push({id:"s"+i,name:i===0?"Au début":i===N?"À la fin":"Après le changement "+i,x,y:cy-h/2,w:wb,h,q:Q("s"+i)});
   if(i<N){const x0=x+wb,m=wa*.05,sh=Math.min(62,h*.28),hh=Math.min(sh*1.7,h*.5),xs=x0+m,xh=x0+wa*.7,xe=x0+wa-m;
    svg+=`<polygon class="inkf" points="${xs},${cy-sh} ${xh},${cy-sh} ${xh},${cy-hh} ${xe},${cy} ${xh},${cy+hh} ${xh},${cy+sh} ${xs},${cy+sh}"/>`;
    Z.push({id:"a"+i,name:"Changement "+(i+1),x:xs+4,y:cy-sh+5,w:(xh-xs)+(xe-xh)*.35,h:2*sh-10,q:Q("a"+i),arrow:1});
    signs.push({id:"a"+i,x:x0+wa*.45,y:Math.max(28,cy-h/2-40)});}
  }
 }else if(k.kind==="comp"){
  svg='<path class="lns" d="M478,36 C530,36 512,100 512,160 L512,262 C512,296 522,306 552,310 C522,314 512,324 512,358 L512,460 C512,520 530,584 478,584"/>';
  const g=22,ph=(560-g*(N-1))/N,pw=N<=2?275:N<=3?300:340;
  for(let i=0;i<N;i++)Z.push({id:"p"+i,name:"Partie "+(i+1),x:455-pw,y:30+i*(ph+g),w:pw,h:ph,q:Q("p"+i)});
  Z.push({id:"tout",name:"Le tout",x:600,y:160,w:320,h:300,q:Q("tout")});
 }else{
  const cx=500,cy=325,r=118,w=N<=4?235:N<=6?190:N<=8?150:125,h=Math.round(w*.84),rx=335,ry=210;
  const start=k.q==="nombre"?270+180/N:135,parts=[];
  for(let i=0;i<N;i++){const a=(start+i*360/N)*Math.PI/180,px=cx+rx*Math.cos(a),py=cy+ry*Math.sin(a);
   svg+=`<line class="lns" x1="${cx}" y1="${cy}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}"/>`;
   parts.push({id:"p"+i,name:"Part "+(i+1),x:px-w/2,y:py-h/2,w,h,q:Q("p"+i)});}
  if(k.q==="nombre"){svg+=`<line class="lns" x1="${cx}" y1="${cy}" x2="${cx+6}" y2="100"/>`;branch={x:cx+8,y:55}}
  Z.push({id:"centre",name:"Le tout",x:cx-r,y:cy-r,w:2*r,h:2*r,q:Q("centre"),circle:1},...parts);
 }
 return{Z,svg,branch,signs};
}
function schemaSVG(id,N,live){

 if(L.branch)s+=`<text class="qt" x="${L.branch.x}" y="${L.branch.y}" text-anchor="middle" dominant-baseline="central" font-size="95">?</text>`;

 const k=SCH[S.schema];
 $("#main").innerHTML=`<div class="ws wrap"><div class="wsbar"><div class="wtitle">${k.title}<button class="speak" data-say="${S.schema}" aria-label="Écouter">🔊</button></div>
 <div class="seg" role="group" aria-label="Représentation">${[["img","Images"],["cube","Cubes"],["num","Nombres"]].map(([v,l])=>`<button data-stage="${v}" aria-pressed="${S.stage===v}">${l}</button>`).join("")}</div></div>
 <div class="stagewrap"><div class="stage${anim?" anim":""}" id="stage">${stageHTML()}</div></div>
 <div class="tools" id="tools">${toolsHTML()}</div>
 ${S.stage==="num"?`<div class="calc"><label>Mon calcul <input id="calc" value="${esc(S.calc)}" placeholder="ex. 12 + 5 = 17" inputmode="text"></label><label>Ma réponse <input id="rep" value="${esc(S.rep)}" placeholder="Il y a…"></label></div>`
 :`<div class="palette" id="pal">${paletteHTML()}</div>`}</div>`;
 requestAnimationFrame(fit);
}
function renderStage(newZone){const st=$("#stage");if(!st)return;st.classList.remove("anim");st.innerHTML=stageHTML();$("#tools").innerHTML=toolsHTML();
 if(newZone){const its=st.querySelectorAll(`.zone[data-z="${newZone}"] .it`);const l=S.stage==="cube"?[...its].find(e=>+e.dataset.i===S.zones[newZone].length-1):its[its.length-1];if(l)l.classList.add("new")}
 fit()}
function sizeStage(){const w=document.querySelector(".stagewrap"),st=$("#stage");if(!w||!st)return;
 const W=w.clientWidth,H=w.clientHeight||W*.62,sw=Math.max(200,Math.min(W,H*1000/620));
 st.style.width=sw+"px";st.style.height=(sw*.62)+"px";st.style.setProperty("--u",(sw/100)+"px")}
function fit(){sizeStage();
 document.querySelectorAll("#stage .items").forEach(box=>{
  const n=box.querySelectorAll(".it").length;if(!n)return;const W=box.clientWidth,H=box.clientHeight;let s;
  const bars=box.querySelectorAll(".bar").length;
  if(bars)s=Math.min(H/10.8,W/(bars*1.3),44);
  else{const f=box.querySelector(".word")?2.6:1;s=Math.sqrt(W*H/(n*f))*.76;s=Math.min(s,Math.min(W,H)*.8,72)}
  box.style.setProperty("--s",Math.max(9,Math.floor(s))+"px");
 });
}

/* ---------- Ajouter / déplacer ---------- */
function tapZone(zid){if(!S.qmode)return addTo(zid);const z=layout(S.schema,S.n,true).Z.find(z=>z.id===zid);if(!z)return;push();S.qset[zid]=!z.q;save();renderStage()}
function changeN(d){const k=SCH[S.schema].kind,[mn,mx]=RANGE[k],N=S.n,M=N+d;if(M<mn||M>mx)return;push();const Z=S.zones,q=S.qset;
 const mv=(a,b)=>{if(Z[a])Z[b]=Z[a];else delete Z[b];delete Z[a];if(a in q)q[b]=q[a];else delete q[b];delete q[a]};
 if(k==="trans"){mv("s"+N,"s"+M);if(d<0){delete Z["a"+M];delete q["a"+M];delete S.signs["a"+M]}}
 else if(d<0){delete Z["p"+M];delete q["p"+M]}
 S.n=M;save();renderStage()}
function addObj(){const inp=$("#newobj");if(!inp)return;const v=inp.value.trim();if(!v||S.nouns.length>=8)return;
 S.nouns.push({name:v,icon:suggest(v)[0]||null,auto:true});S.sel=S.nouns.length-1;save();$("#pal").innerHTML=paletteHTML();const ni=$("#newobj");if(ni)ni.focus()}
function addTo(zid){if(!S.nouns[S.sel])return;push();(S.zones[zid]=S.zones[zid]||[]).push(S.sel);save();renderStage(zid)}
let drag=null;
function zoneAt(x,y){const e=document.elementFromPoint(x,y);return e?e.closest("#stage .zone"):null}
function hl(z){document.querySelectorAll(".zone.over").forEach(e=>e!==z&&e.classList.remove("over"));if(z)z.classList.add("over")}
function startDrag(e,src){if(e.button>0)return;e.preventDefault();drag={src,x0:e.clientX,y0:e.clientY,moved:false,ghost:null};
 addEventListener("pointermove",onMove);addEventListener("pointerup",onUp);addEventListener("pointercancel",onCancel)}
function stopListen(){removeEventListener("pointermove",onMove);removeEventListener("pointerup",onUp);removeEventListener("pointercancel",onCancel)}
function onMove(e){if(!drag)return;if(!drag.moved){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<9||drag.src.type==="tap")return;
  drag.moved=true;const g=document.createElement("div");g.className="ghost";
  if(drag.src.type==="pal"){g.innerHTML=S.stage==="cube"?`<span class="it cube" style="--c:${col(drag.src.noun)}"></span>`:itemHTML(drag.src.noun,0,0)}
  else{g.innerHTML=drag.src.el.outerHTML;drag.src.el.classList.add("lifted")}
  document.body.appendChild(g);drag.ghost=g}
 drag.ghost.style.left=e.clientX+"px";drag.ghost.style.top=e.clientY+"px";hl(zoneAt(e.clientX,e.clientY))}
function onCancel(){stopListen();if(drag&&drag.ghost)drag.ghost.remove();if(drag&&drag.src.el)drag.src.el.classList.remove("lifted");hl(null);drag=null}
function onUp(e){stopListen();const d=drag;drag=null;if(!d)return;if(d.ghost)d.ghost.remove();hl(null);
 if(!d.moved){if(d.src.type==="pal"){S.sel=d.src.noun;save();$("#pal").innerHTML=paletteHTML()}else tapZone(d.src.zone);return}
 const z=zoneAt(e.clientX,e.clientY),zid=z&&z.dataset.z;
 if(d.src.type==="pal"){if(zid){S.sel=d.src.noun;addTo(zid);$("#pal").innerHTML=paletteHTML()}return}
 push();const n=S.zones[d.src.zone].splice(d.src.idx,1)[0];if(zid)(S.zones[zid]=S.zones[zid]||[]).push(n);save();renderStage(zid)}

/* ---------- Événements ---------- */
document.addEventListener("pointerdown",e=>{
 if(S.screen!=="ws")return;
 const tok=e.target.closest(".tok");if(tok){startDrag(e,{type:"pal",noun:+tok.dataset.tok});return}
 if(S.stage==="num")return;
 const z=e.target.closest("#stage .zone");if(!z)return;const it=e.target.closest(".it");
 startDrag(e,it?{type:"item",zone:z.dataset.z,idx:+it.dataset.i,el:it}:{type:"tap",zone:z.dataset.z});
});
document.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&e.target.id==="newobj"){e.preventDefault();addObj();return}
 if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.in!==undefined){e.preventDefault();e.target.blur();return}
 if(e.key==="Escape"&&P.open){closePick();return}
 if(e.key==="Enter"&&e.target.id==="psearch"){e.preventDefault();closePick(true);return}
if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("#stage .zone")&&S.stage!=="num"){e.preventDefault();tapZone(e.target.dataset.z)}});
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(d.go){go(d.go);return}
 if(d.tile!==undefined){pickTile(d.tile,d.name);return}
 if(d.cat!==undefined){P.cat=d.cat;P.q="";$("#psearch").value="";renderPick();return}
 if(d.repl!==undefined){openPick("repl",+d.repl);return}
 if(d.act==="openpick"){openPick("add");return}
 if(d.act==="pdone"){closePick(true);return}
 if(d.prop!==undefined){const i=+d.prop;P.skip[i]=!P.skip[i];renderPick();return}
 if(d.act==="web"){webSearch();return}
 if(d.act==="useword"){const q=P.q.trim();if(q)pickTile("",q);return}
 if(d.pick){if(S.schema!==d.pick){S.schema=d.pick;S.zones={};S.signs={};S.qset={};S.qmode=false;S.n=DEFN[SCH[d.pick].kind];hist=[]}S.screen="nouns";save();render();return}
 if(d.say){say(SCH[d.say].title+". "+SCH[d.say].desc);return}
 if("sayen" in d){say(S.enonce);return}
 if(d.ic!==undefined){const n=S.nouns[+d.ic];n.icon=d.e;n.auto=false;save();renderChips(+d.ic);return}
 if(d.word!==undefined){const n=S.nouns[+d.word];n.icon=null;n.auto=false;save();renderChips(+d.word);return}
 if(d.more!==undefined){const i=+d.more;const prev=openMore;openMore=openMore===i?-1:i;if(prev>=0&&prev!==i&&$("#ch"+prev))renderChips(prev);renderChips(i);return}
 if(d.del!==undefined){removeNoun(+d.del);save();renderNouns();return}
 if(t.id==="addn"){if(S.nouns.length>=MAXN)return;S.nouns.push({name:"",icon:null,auto:true});save();renderNouns();const ins=document.querySelectorAll("[data-in]");ins[ins.length-1].focus();return}
 if(t.id==="reset"){if(confirm("Effacer ce problème et en commencer un nouveau ?")){S=fresh();hist=[];save();render()}return}
 if(d.stage){if(S.stage!==d.stage){S.stage=d.stage;save();renderWS(d.stage!=="num")}return}
 if(d.sign){push();S.signs[d.sign]=S.signs[d.sign]==="-"?"+":"-";save();renderStage();return}
 if(d.act){const a=d.act;
  if(a==="undo"){const h=hist.pop();if(h){Object.assign(S,JSON.parse(h));save();renderStage()}}
  else if(a==="clear"){push();S.zones={};save();renderStage()}
  else if(a==="nums"){S.showNums=!S.showNums;save();renderStage()}
  else if(a==="g10"){S.group10=!S.group10;save();renderStage()}
  else if(a==="nplus")changeN(1);else if(a==="nminus")changeN(-1);
  else if(a==="qmode"){S.qmode=!S.qmode;save();renderStage();$("#pal").innerHTML=paletteHTML()}
  else if(a==="addobj")addObj();
  else if(a==="copy"){push();for(let i=1;i<S.n;i++)S.zones["p"+i]=[...(S.zones.p0||[])];save();renderStage()}
 }
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.id==="en"){S.enonce=t.value;save();return}
 if(t.id==="calc"){S.calc=t.value;save();return}
 if(t.id==="rep"){S.rep=t.value;save();return}
 if(t.dataset.in!==undefined){const i=+t.dataset.in;S.nouns[i].name=t.value;$("#msg").textContent="";save();renderSteps();return}
 if(t.id==="psearch"){P.q=t.value;renderPick(true);return}
});
addEventListener("resize",()=>requestAnimationFrame(fit));
/* ---------- Choix des objets ---------- */
const P={open:false,mode:"add",idx:-1,cat:CATS[0],q:"",web:null,webQ:"",webMsg:"",timer:0,props:[],over:{},skip:{},best:{}};
function bestMatch(w,prefix){const n=norm(w);if(n.length<2)return null;
 return DB.find(e=>norm(e.name)===n)||DB.find(e=>e.keys.includes(n))||(prefix&&n.length>=3?DB.find(e=>e.keys.some(k=>k.startsWith(n))):null)}
function parseMulti(q){const out=[];
 q.split(/[,;\n]+/).forEach(seg=>{seg=seg.trim();if(!seg)return;
  if(/\s/.test(seg)){const whole=bestMatch(seg,false);if(whole){out.push({w:seg,e:whole});return}
   seg.split(/\s+/).forEach(w=>{const n=norm(w);if(n.length<2||STOP.includes(n))return;out.push({w,e:bestMatch(w,true)})})}
  else{const n=norm(seg);if(n.length<2||STOP.includes(n))return;out.push({w:seg,e:bestMatch(seg,true)})}});
 return out}
function propsList(){return P.props.map((p,i)=>{const o=P.over[i];if(o)return{icon:o.icon,name:o.name};if(p.e)return{icon:p.e.icon,name:p.e.name};
  const b=P.best[norm(p.w)];return{icon:b?"img:"+b:null,name:p.w,wait:b===undefined}})}
async function fetchBest(w){const k=norm(w);if(k in P.best)return;P.best[k]=undefined;
 try{const r=await fetch("https://api.arasaac.org/api/pictograms/fr/search/"+encodeURIComponent(w.toLowerCase()));const js=r.ok?await r.json():[];
  P.best[k]=Array.isArray(js)&&js.length?`https://static.arasaac.org/pictograms/${js[0]._id}/${js[0]._id}_300.png`:null}catch(e){P.best[k]=null}
 if(P.open)renderPick()}
function openPick(mode,idx){P.open=true;P.props=[];P.over={};P.skip={};P.mode=mode;P.idx=idx;P.q="";P.web=null;P.webMsg="";const m=$("#picker");m.hidden=false;$("#psearch").value="";
 $("#ptitle").textContent=mode==="repl"?"Choisis une nouvelle image":"Touche les objets du problème";renderPick();setTimeout(()=>$("#psearch").focus(),50)}
function closePick(ok){
 if(ok&&P.mode==="add"){propsList().forEach((p,i)=>{if(P.skip[i]||S.nouns.length>=MAXN)return;
  if(p.icon?S.nouns.some(n=>n.icon===p.icon):S.nouns.some(n=>!n.icon&&n.name===p.name))return;
  S.nouns.push({name:p.name,icon:p.icon,auto:false});S.sel=S.nouns.length-1});save()}
 P.open=false;$("#picker").hidden=true;clearTimeout(P.timer);if(S.screen==="nouns")renderNouns();else if(S.screen==="ws"&&$("#pal")){$("#pal").innerHTML=paletteHTML()}renderSteps()}
function tileHTML(icon,name){const has=P.mode==="add"&&icon&&S.nouns.some(n=>n.icon===icon);
 return`<button class="tile${has?" has":""}" data-tile="${esc(icon)}" data-name="${esc(name)}">${icoHTML(icon)}<span>${esc(name)}</span></button>`}
function renderPick(fromTyping){
 const q=P.q.trim();$("#pcats").innerHTML=CATS.map(c=>`<button class="chip txt" data-cat="${esc(c)}" aria-pressed="${!q&&P.cat===c}">${DB.find(e=>e.cat===c).icon} ${c}</button>`).join("");
 let list;
 if(q&&P.mode==="add"){const old=JSON.stringify(P.props.map(p=>p.w));P.props=parseMulti(q);if(JSON.stringify(P.props.map(p=>p.w))!==old){P.over={};P.skip={}}
  const seen=new Set();list=[];P.props.forEach(p=>searchLocal(p.w).forEach(e=>{if(!seen.has(e.icon)){seen.add(e.icon);list.push(e)}}));
  P.props.forEach(p=>{if(!p.e&&norm(p.w).length>=3)fetchBest(p.w)});
 }else{P.props=[];list=q?searchLocal(q):DB.filter(e=>e.cat===P.cat)}
 const pl=propsList();
 $("#pprop").innerHTML=pl.length?`<div class="prop"><b>Je vais ajouter :</b>${pl.map((p,i)=>`<button class="tile${P.skip[i]?" off":" has"}" data-prop="${i}" aria-pressed="${!P.skip[i]}">${p.wait?`<span class="it word" style="--c:var(--line)">…</span>`:p.icon?icoHTML(p.icon):`<span class="it word" style="--c:var(--c0)">Aa</span>`}<span>${esc(p.name)}</span></button>`).join("")}<span class="ptip">Touche un dessin pour le retirer. Touche un dessin plus bas pour le remplacer. Puis appuie sur OK.</span></div>`:"";
 let h=list.map(e=>tileHTML(e.icon,e.name)).join("");
 if(q&&!list.length)h=`<p class="empty">« ${esc(q)} » n'est pas dans la banque d'images.</p>`;
 $("#pgrid").innerHTML=h;
 let w="";
 if(q&&P.props.length<=1){w+=`<div class="webbar"><button class="btn" data-act="web">🌐 Chercher « ${esc(q)} » sur Internet</button><button class="btn" data-act="useword">Écrire seulement le mot « ${esc(q)} »</button></div>`;
  if(P.web&&P.webQ===q)w+=P.web.length?`<div class="pgrid">${P.web.map(u=>tileHTML("img:"+u,q)).join("")}</div>`:"";
  if(P.webMsg&&P.webQ===q)w+=`<p class="empty">${P.webMsg}</p>`}
 $("#pweb").innerHTML=w;
 if(fromTyping){clearTimeout(P.timer);if(P.props.length<=1&&q.length>=3&&list.length<2&&P.webQ!==q)P.timer=setTimeout(webSearch,700)}
}
async function webSearch(){const q=P.q.trim();if(!q)return;clearTimeout(P.timer);P.webQ=q;P.web=null;P.webMsg="Recherche sur Internet…";renderPick();
 try{const r=await fetch("https://api.arasaac.org/api/pictograms/fr/search/"+encodeURIComponent(q.toLowerCase()));
  if(P.webQ!==q)return;
  if(!r.ok){P.web=[];P.webMsg="Aucune image trouvée sur Internet pour ce mot. Essaie au singulier ou un autre mot.";renderPick();return}
  const js=await r.json();P.web=(Array.isArray(js)?js:[]).slice(0,24).map(p=>`https://static.arasaac.org/pictograms/${p._id}/${p._id}_300.png`);
  P.webMsg=P.web.length?"":"Aucune image trouvée sur Internet pour ce mot. Essaie au singulier ou un autre mot.";
 }catch(e){if(P.webQ!==q)return;P.web=[];P.webMsg="Impossible de joindre Internet. Vérifie la connexion."}
 renderPick()}
function pickTile(icon,name){icon=icon||null;
 if(P.mode==="add"&&P.props.length&&icon){const e=DB.find(x=>x.icon===icon);let i=-1;
  if(e)i=P.props.findIndex(p=>{const n=norm(p.w);return e.keys.some(k=>k.startsWith(n)||(n.length>=4&&n.startsWith(k)))});
  else if(isImg(icon))i=P.props.findIndex(p=>p.w===name);
  if(i>=0){P.over[i]={icon,name};P.skip[i]=false;renderPick();return}}
 if(P.mode==="repl"){const n=S.nouns[P.idx];if(n){const old=n.icon;n.icon=icon;const oldName=(DB.find(e=>e.icon===old)||{}).name;if(!n.name.trim()||n.name===oldName||isImg(old))n.name=name}save();closePick();return}
 const at=icon?S.nouns.findIndex(n=>n.icon===icon):S.nouns.findIndex(n=>!n.icon&&n.name===name);
 if(at>=0){const used=Object.values(S.zones).some(l=>l.includes(at));if(!used){removeNoun(at);save()}}
 else{if(S.nouns.length>=MAXN){alert("10 objets au maximum.");return}S.nouns.push({name,icon,auto:false});S.sel=S.nouns.length-1;save()}
 renderPick()}
try{speechSynthesis.getVoices()}catch(e){}
render();
</script>
</body>
